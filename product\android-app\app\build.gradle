apply plugin: 'com.android.application'

android {
    namespace 'com.controllerbridge.app'
    compileSdkVersion 34

    defaultConfig {
        applicationId 'com.controllerbridge.app'
        minSdkVersion 26
        targetSdkVersion 34
        versionCode 1
        versionName '0.1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        bridgeDebug {
            storeFile rootProject.file('.android-user/controller-bridge-debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
            storeType 'PKCS12'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.bridgeDebug
        }
    }
}
