<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Controller Bridge connection modes</title>
  <desc id="desc">A Bluetooth controller connects to an Android phone, which sends input to a Windows PC using USB or Wi-Fi.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101722"/><stop offset="1" stop-color="#17263b"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#62a0ff"/><stop offset="1" stop-color="#2870ed"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#02050a" flood-opacity=".45"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1 10 6 1 11" fill="none" stroke="#7cb2ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect width="1200" height="520" rx="30" fill="url(#bg)"/>
  <text x="600" y="54" fill="#f4f7fb" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="700">One phone bridge · two ways to reach your PC</text>
  <g filter="url(#shadow)">
    <rect x="68" y="186" width="210" height="150" rx="24" fill="#202d3d" stroke="#34465b" stroke-width="2"/>
    <rect x="463" y="142" width="178" height="238" rx="28" fill="#202d3d" stroke="#49617d" stroke-width="3"/>
    <rect x="477" y="159" width="150" height="204" rx="18" fill="#111923"/>
    <rect x="493" y="178" width="118" height="166" rx="12" fill="#142947"/>
    <circle cx="552" cy="353" r="4" fill="#65788e"/>
    <rect x="897" y="186" width="230" height="150" rx="18" fill="#202d3d" stroke="#34465b" stroke-width="2"/>
    <path d="M870 350h284l20 20H850z" fill="#34465b"/>
  </g>
  <g fill="#dce6f2" font-family="Segoe UI,Arial,sans-serif" text-anchor="middle">
    <text x="173" y="370" font-size="18" font-weight="700">Bluetooth controller</text>
    <text x="552" y="412" font-size="18" font-weight="700">Android phone</text>
    <text x="1012" y="397" font-size="18" font-weight="700">Windows PC</text>
  </g>
  <g transform="translate(112 224)" fill="none" stroke="#b8c7d9" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M22 24c-12 0-18 12-21 28L-5 85c-2 12 10 18 18 10l17-17h30l17 17c8 8 20 2 18-10l-6-33c-3-16-9-28-21-28H22Z"/>
    <path d="M20 46v24M8 58h24M64 53h1M78 66h1"/>
  </g>
  <g transform="translate(519 202)">
    <path d="M35 52V26m0 0L18 11m17 15 16-17m-16 39L17 67m18-15 19 17m-19-63v84" fill="none" stroke="#7cb2ff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="35" cy="26" r="5" fill="#7cb2ff"/><circle cx="35" cy="52" r="5" fill="#7cb2ff"/>
    <path d="M82 22c15 14 15 39 0 53M94 11c23 22 23 55 0 76" fill="none" stroke="#57a6ff" stroke-width="4" stroke-linecap="round" opacity=".9"/>
  </g>
  <g fill="none" stroke="#7cb2ff" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)">
    <path d="M290 248h140" stroke-dasharray="9 10"/>
    <path d="M656 227h196"/>
    <path d="M656 300h196" stroke-dasharray="9 10"/>
  </g>
  <g font-family="Segoe UI,Arial,sans-serif" text-anchor="middle" font-size="16" font-weight="700">
    <rect x="708" y="194" width="92" height="30" rx="15" fill="#1b385f"/><text x="754" y="215" fill="#cfe3ff">USB · ADB</text>
    <rect x="708" y="311" width="92" height="30" rx="15" fill="#1b385f"/><text x="754" y="332" fill="#cfe3ff">Wi-Fi</text>
    <text x="360" y="232" fill="#8294aa" font-size="13" font-weight="500">paired over Bluetooth</text>
  </g>
  <text x="600" y="478" fill="#8192a8" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14">The PC receives virtual controller input from the phone</text>
</svg>

