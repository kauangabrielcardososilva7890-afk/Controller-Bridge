<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">Controller connection routes</title>
  <desc id="desc">A Bluetooth game controller sends input to an Android phone. The phone forwards it to a Windows PC over USB or Wi-Fi.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111821"/><stop offset="1" stop-color="#17263a"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#79b4ff"/><stop offset="1" stop-color="#397bf4"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#79b4ff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>text{font-family:"Segoe UI",Arial,sans-serif}.card{fill:#202b39;stroke:#34465c;stroke-width:2}.label{fill:#f0f5fb;font-size:20px;font-weight:700}.sub{fill:#9bacbf;font-size:14px}.route{fill:none;stroke:#79b4ff;stroke-width:3.5;stroke-linecap:round;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1200" height="600" rx="28" fill="url(#background)"/>
  <text x="600" y="62" text-anchor="middle" fill="#f4f7fb" font-size="28" font-weight="700">One controller, two connection routes</text>
  <text x="600" y="91" text-anchor="middle" fill="#9bacbf" font-size="15">The phone bridges the controller to your PC</text>

  <rect class="card" x="48" y="145" width="270" height="350" rx="22"/>
  <rect class="card" x="465" y="145" width="270" height="350" rx="22"/>
  <rect class="card" x="882" y="145" width="270" height="350" rx="22"/>

  <!-- Gamepad -->
  <g transform="translate(125 235)" fill="none" stroke="#c7d5e5" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M42 15C22 15 13 30 8 52L1 88c-3 15 11 22 21 11l20-20h52l20 20c10 11 24 4 21-11l-7-36c-5-22-14-37-34-37Z"/>
    <path d="M43 39v30M28 54h30M92 47h1M109 63h1"/>
  </g>
  <text class="label" x="183" y="390" text-anchor="middle">Bluetooth controller</text>
  <text class="sub" x="183" y="419" text-anchor="middle">Paired with the phone</text>

  <!-- Phone -->
  <rect x="548" y="208" width="104" height="174" rx="19" fill="#0e151f" stroke="#7893b2" stroke-width="4"/>
  <rect x="560" y="226" width="80" height="132" rx="9" fill="#193456"/>
  <circle cx="600" cy="369" r="4" fill="#7893b2"/>
  <path d="M600 266v54m0-54-17-15m17 15 17-15m-17 69-18 16m18-16 18 16m-18-69v-22" fill="none" stroke="url(#accent)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="600" cy="266" r="4" fill="#79b4ff"/><circle cx="600" cy="320" r="4" fill="#79b4ff"/>
  <text class="label" x="600" y="422" text-anchor="middle">Android phone</text>
  <text class="sub" x="600" y="451" text-anchor="middle">Reads input and forwards it</text>

  <!-- PC -->
  <rect x="944" y="224" width="146" height="105" rx="10" fill="#111a25" stroke="#7893b2" stroke-width="4"/>
  <rect x="955" y="235" width="124" height="82" rx="4" fill="#1b3453"/>
  <path d="M1017 330v24m-35 0h70m-60-13h50" fill="none" stroke="#7893b2" stroke-width="5" stroke-linecap="round"/>
  <text class="label" x="1017" y="410" text-anchor="middle">Windows PC</text>
  <text class="sub" x="1017" y="439" text-anchor="middle">Receives virtual input</text>

  <!-- Bluetooth route -->
  <path class="route" d="M331 276H447" stroke-dasharray="7 8"/>
  <rect x="341" y="232" width="96" height="28" rx="14" fill="#1b3553"/>
  <text x="389" y="251" text-anchor="middle" fill="#cfe3ff" font-size="13" font-weight="700">Bluetooth</text>

  <!-- Phone-to-PC routes -->
  <path class="route" d="M748 274H861"/>
  <path class="route" d="M748 346H861" stroke-dasharray="7 8"/>
  <rect x="777" y="232" width="58" height="28" rx="14" fill="#1b3553"/>
  <text x="806" y="251" text-anchor="middle" fill="#cfe3ff" font-size="13" font-weight="700">USB</text>
  <rect x="769" y="360" width="74" height="28" rx="14" fill="#1b3553"/>
  <text x="806" y="379" text-anchor="middle" fill="#cfe3ff" font-size="13" font-weight="700">Wi-Fi</text>
  <text x="600" y="552" text-anchor="middle" fill="#8497ad" font-size="14">Choose either USB or Wi-Fi between the phone and PC</text>
</svg>
