<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">Multiple controller profiles and virtual outputs</title>
  <desc id="desc">Two physical controllers have independent profiles and can each choose an Xbox 360 or DualShock 4 virtual output.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101722"/><stop offset="1" stop-color="#17263b"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#02050a" flood-opacity=".4"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1 10 6 1 11" fill="none" stroke="#7cb2ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect width="1200" height="440" rx="30" fill="url(#bg)"/>
  <text x="600" y="54" fill="#f4f7fb" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="700">Configure each controller independently</text>
  <g filter="url(#shadow)">
    <rect x="54" y="112" width="278" height="120" rx="20" fill="#202d3d" stroke="#34465b" stroke-width="2"/>
    <rect x="54" y="260" width="278" height="120" rx="20" fill="#202d3d" stroke="#34465b" stroke-width="2"/>
    <rect x="454" y="112" width="270" height="120" rx="20" fill="#1c2a3a" stroke="#41618a" stroke-width="2"/>
    <rect x="454" y="260" width="270" height="120" rx="20" fill="#1c2a3a" stroke="#41618a" stroke-width="2"/>
    <rect x="854" y="112" width="290" height="120" rx="20" fill="#193352" stroke="#397cf6" stroke-width="2"/>
    <rect x="854" y="260" width="290" height="120" rx="20" fill="#193352" stroke="#397cf6" stroke-width="2"/>
  </g>
  <g fill="#e6edf6" font-family="Segoe UI,Arial,sans-serif">
    <text x="186" y="157" text-anchor="middle" font-size="18" font-weight="700">Controller 1</text>
    <text x="186" y="188" text-anchor="middle" font-size="14" fill="#96a9bf">buttons · sticks · gyro</text>
    <text x="186" y="305" text-anchor="middle" font-size="18" font-weight="700">Controller 2</text>
    <text x="186" y="336" text-anchor="middle" font-size="14" fill="#96a9bf">independent settings</text>
    <text x="589" y="157" text-anchor="middle" font-size="18" font-weight="700">Profile 1</text>
    <text x="589" y="188" text-anchor="middle" font-size="14" fill="#96a9bf">automatic or custom mapping</text>
    <text x="589" y="305" text-anchor="middle" font-size="18" font-weight="700">Profile 2</text>
    <text x="589" y="336" text-anchor="middle" font-size="14" fill="#96a9bf">remap without changing profile 1</text>
    <text x="999" y="157" text-anchor="middle" font-size="18" font-weight="700">Xbox 360 output</text>
    <text x="999" y="188" text-anchor="middle" font-size="14" fill="#a8c7f2">virtual gamepad on Windows</text>
    <text x="999" y="305" text-anchor="middle" font-size="18" font-weight="700">DualShock 4 output</text>
    <text x="999" y="336" text-anchor="middle" font-size="14" fill="#a8c7f2">virtual gamepad on Windows</text>
  </g>
  <g fill="none" stroke="#7cb2ff" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)">
    <path d="M346 171h86"/><path d="M346 319h86"/><path d="M738 171h86"/><path d="M738 319h86"/>
  </g>
  <g fill="#aebed0" transform="translate(87 138)" stroke="#aebed0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M24 13c-9 0-14 9-17 21L3 61c-2 9 7 13 13 7l13-12h23l13 12c6 6 15 2 13-7l-4-27c-3-12-8-21-17-21H24Z" fill="none"/>
    <path d="M25 29v17M16 37h18M53 34h1M63 43h1"/>
  </g>
  <g fill="#aebed0" transform="translate(87 286)" stroke="#aebed0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M24 13c-9 0-14 9-17 21L3 61c-2 9 7 13 13 7l13-12h23l13 12c6 6 15 2 13-7l-4-27c-3-12-8-21-17-21H24Z" fill="none"/>
    <path d="M25 29v17M16 37h18M53 34h1M63 43h1"/>
  </g>
  <text x="600" y="417" fill="#8192a8" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14">Choose the PC output for each controller separately</text>
</svg>

