<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Perfis e saídas independentes por controle</title>
  <desc id="desc">Cada controle conectado tem seu próprio perfil e sua própria saída virtual no PC. Alterar um perfil não modifica o outro.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111821"/><stop offset="1" stop-color="#17263a"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#79b4ff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>text{font-family:"Segoe UI",Arial,sans-serif}.card{fill:#202b39;stroke:#34465c;stroke-width:2}.profile{fill:#1c2a3a;stroke:#45658d;stroke-width:2}.output{fill:#193352;stroke:#397bf4;stroke-width:2}.name{fill:#f0f5fb;font-size:19px;font-weight:700}.sub{fill:#9bacbf;font-size:14px}.arrow{fill:none;stroke:#79b4ff;stroke-width:3.5;stroke-linecap:round;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1200" height="560" rx="28" fill="url(#background)"/>
  <text x="600" y="62" text-anchor="middle" fill="#f4f7fb" font-size="28" font-weight="700">Cada controle tem seu próprio perfil</text>
  <text x="600" y="91" text-anchor="middle" fill="#9bacbf" font-size="15">Edite um controle sem alterar os demais</text>

  <!-- Linha do controle 1 -->
  <rect class="card" x="48" y="145" width="300" height="140" rx="20"/>
  <rect class="profile" x="450" y="145" width="300" height="140" rx="20"/>
  <rect class="output" x="852" y="145" width="300" height="140" rx="20"/>
  <circle cx="78" cy="175" r="15" fill="#315b91"/><text x="78" y="180" text-anchor="middle" fill="#eaf3ff" font-size="13" font-weight="700">01</text>
  <g transform="translate(76 204) scale(.55)" fill="none" stroke="#c7d5e5" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"><path d="M42 15C22 15 13 30 8 52L1 88c-3 15 11 22 21 11l20-20h52l20 20c10 11 24 4 21-11l-7-36c-5-22-14-37-34-37Z"/><path d="M43 39v30M28 54h30M92 47h1M109 63h1"/></g>
  <text class="name" x="214" y="205" text-anchor="middle">Controle 1</text><text class="sub" x="214" y="233" text-anchor="middle">Entrada física</text>
  <path class="arrow" d="M362 215H434"/>
  <g transform="translate(490 190)" fill="none" stroke="#79b4ff" stroke-width="4" stroke-linecap="round"><path d="M0 5h32M0 20h32M0 35h32"/><circle cx="10" cy="5" r="5" fill="#1c2a3a"/><circle cx="24" cy="20" r="5" fill="#1c2a3a"/><circle cx="14" cy="35" r="5" fill="#1c2a3a"/></g>
  <text class="name" x="626" y="205" text-anchor="middle">Perfil 1</text><text class="sub" x="626" y="233" text-anchor="middle">Mapeamento e ajustes próprios</text>
  <path class="arrow" d="M764 215H836"/>
  <rect x="890" y="188" width="58" height="42" rx="5" fill="#111a25" stroke="#a9c9f1" stroke-width="3"/><path d="M919 230v10m-17 0h34" stroke="#a9c9f1" stroke-width="3" stroke-linecap="round"/>
  <text class="name" x="1030" y="205" text-anchor="middle">Saída virtual 1</text><text class="sub" x="1030" y="233" text-anchor="middle">Tipo escolhido no PC</text>

  <!-- Linha do controle 2 -->
  <rect class="card" x="48" y="325" width="300" height="140" rx="20"/>
  <rect class="profile" x="450" y="325" width="300" height="140" rx="20"/>
  <rect class="output" x="852" y="325" width="300" height="140" rx="20"/>
  <circle cx="78" cy="355" r="15" fill="#315b91"/><text x="78" y="360" text-anchor="middle" fill="#eaf3ff" font-size="13" font-weight="700">02</text>
  <g transform="translate(76 384) scale(.55)" fill="none" stroke="#c7d5e5" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"><path d="M42 15C22 15 13 30 8 52L1 88c-3 15 11 22 21 11l20-20h52l20 20c10 11 24 4 21-11l-7-36c-5-22-14-37-34-37Z"/><path d="M43 39v30M28 54h30M92 47h1M109 63h1"/></g>
  <text class="name" x="214" y="385" text-anchor="middle">Controle 2</text><text class="sub" x="214" y="413" text-anchor="middle">Entrada física</text>
  <path class="arrow" d="M362 395H434"/>
  <g transform="translate(490 370)" fill="none" stroke="#79b4ff" stroke-width="4" stroke-linecap="round"><path d="M0 5h32M0 20h32M0 35h32"/><circle cx="10" cy="5" r="5" fill="#1c2a3a"/><circle cx="24" cy="20" r="5" fill="#1c2a3a"/><circle cx="14" cy="35" r="5" fill="#1c2a3a"/></g>
  <text class="name" x="626" y="385" text-anchor="middle">Perfil 2</text><text class="sub" x="626" y="413" text-anchor="middle">Independente do perfil 1</text>
  <path class="arrow" d="M764 395H836"/>
  <rect x="890" y="368" width="58" height="42" rx="5" fill="#111a25" stroke="#a9c9f1" stroke-width="3"/><path d="M919 410v10m-17 0h34" stroke="#a9c9f1" stroke-width="3" stroke-linecap="round"/>
  <text class="name" x="1030" y="385" text-anchor="middle">Saída virtual 2</text><text class="sub" x="1030" y="413" text-anchor="middle">Configurada separadamente</text>

  <text x="600" y="515" text-anchor="middle" fill="#8497ad" font-size="14">Cada entrada usa seu próprio perfil e saída no PC</text>
</svg>
