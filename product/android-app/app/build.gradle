apply plugin: 'com.android.application'

android {
    namespace 'com.controllerbridge.app'
    compileSdkVersion 34

    defaultConfig {
        applicationId 'com.controllerbridge.app'
        minSdkVersion 26
        targetSdkVersion 34
        versionCode 3
        versionName '0.3.0'
    }

    buildFeatures {
        buildConfig true
    }

    flavorDimensions 'language'
    productFlavors {
        ptBr {
            dimension 'language'
            manifestPlaceholders = [appLabel: 'Controller Bridge · PT-BR']
            buildConfigField 'String', 'DEFAULT_LANGUAGE', '"pt"'
        }
        en {
            dimension 'language'
            applicationIdSuffix '.en'
            manifestPlaceholders = [appLabel: 'Controller Bridge · EN']
            buildConfigField 'String', 'DEFAULT_LANGUAGE', '"en"'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        bridgeDebug {
            storeFile rootProject.file('.android-user/controller-bridge-debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
            storeType 'PKCS12'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.bridgeDebug
        }
    }
}

