name: Build and publish v0.5.0

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release-v050.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - name: Build both Windows packages
        shell: pwsh
        run: .\product\windows-host\Package-Release.ps1 -OutputPath artifacts\windows
      - uses: actions/upload-artifact@v7
        with:
          name: windows-packages
          path: |
            artifacts/windows/ControllerBridge-Windows-PT-BR-v0.5.0.zip
            artifacts/windows/ControllerBridge-Windows-EN-v0.5.0.zip
          if-no-files-found: error
          retention-days: 2

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.2.1"
      - name: Create Android debug signing key
        shell: bash
        run: |
          mkdir -p product/android-app/.android-user
          keytool -genkeypair -noprompt -storetype PKCS12 \
            -keystore product/android-app/.android-user/controller-bridge-debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -dname "CN=Controller Bridge Debug,O=Controller Bridge,C=BR" \
            -keyalg RSA -keysize 2048 -validity 10000
      - name: Build both Android packages
        working-directory: product/android-app
        run: gradle --no-daemon :app:assemblePtBrDebug :app:assembleEnDebug
      - name: Verify mapping and Wi-Fi checks
        working-directory: product/android-app
        shell: bash
        run: |
          mkdir -p build/mapping-checks
          javac -encoding UTF-8 -d build/mapping-checks \
            app/src/main/java/com/controllerbridge/app/MappingModel.java \
            app/src/main/java/com/controllerbridge/app/ProfileIdAllocator.java \
            app/src/main/java/com/controllerbridge/app/BridgeLifecycle.java \
            app/src/main/java/com/controllerbridge/app/ControllerInputFilter.java \
            app/src/main/java/com/controllerbridge/app/MotionDeviceMatcher.java \
            app/src/main/java/com/controllerbridge/app/WifiSecureChannel.java \
            app/src/test/java/com/controllerbridge/app/MappingModelSelfTest.java \
            app/src/test/java/com/controllerbridge/app/WifiSecureChannelSelfTest.java
          java -cp build/mapping-checks com.controllerbridge.app.MappingModelSelfTest
          java -cp build/mapping-checks com.controllerbridge.app.WifiSecureChannelSelfTest
      - name: Collect APKs
        working-directory: product/android-app
        shell: bash
        run: |
          mkdir -p dist
          pt_apk="$(find app/build/outputs/apk/ptBr/debug -maxdepth 1 -name '*.apk' -print -quit)"
          en_apk="$(find app/build/outputs/apk/en/debug -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$pt_apk"
          test -n "$en_apk"
          cp "$pt_apk" dist/ControllerBridge-Android-PT-BR-v0.5.0.apk
          cp "$en_apk" dist/ControllerBridge-Android-EN-v0.5.0.apk
      - uses: actions/upload-artifact@v7
        with:
          name: android-packages
          path: |
            product/android-app/dist/ControllerBridge-Android-PT-BR-v0.5.0.apk
            product/android-app/dist/ControllerBridge-Android-EN-v0.5.0.apk
          if-no-files-found: error
          retention-days: 2

  release:
    needs: [windows, android]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
      github.event.head_commit.message == 'Build and publish v0.5.0 packages')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: windows-packages
          path: release-assets
      - uses: actions/download-artifact@v7
        with:
          name: android-packages
          path: release-assets
      - name: Generate checksums
        shell: bash
        run: |
          cd release-assets
          sha256sum *.apk *.zip > SHA256SUMS.txt
          test "$(find . -maxdepth 1 -type f \( -name '*.apk' -o -name '*.zip' \) | wc -l)" -eq 4
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: v0.5.0
          name: Controller Bridge v0.5.0
          target_commitish: main
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          overwrite_files: true
          files: release-assets/*
          body: |
            ## English
            Installable Android and Windows packages in PT-BR and English. Windows ZIPs include the EXE and required setup files. See the README for installation and connection instructions. SHA256SUMS.txt contains checksums for all four packages.

            ## Português
            Pacotes instaláveis para Android e Windows em PT-BR e inglês. Os ZIPs Windows incluem o EXE e os arquivos necessários. Consulte o README para instruções de instalação e conexão. SHA256SUMS.txt contém os hashes dos quatro pacotes.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
