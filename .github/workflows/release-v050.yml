name: Build and publish Controller Bridge release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release-v050.yml"
      - "product/windows-host/**"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - name: Build both Windows packages
        shell: pwsh
        run: .\product\windows-host\Package-Release.ps1 -OutputPath artifacts\windows
      - uses: actions/upload-artifact@v7
        with:
          name: windows-packages
          path: |
            artifacts/windows/ControllerBridge-Windows-PT-BR-v0.5.2.zip
            artifacts/windows/ControllerBridge-Windows-EN-v0.5.2.zip
          if-no-files-found: error
          retention-days: 2

  release:
    needs: [windows]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
      github.event.head_commit.message == 'Fix USB startup waiting and publish v0.5.2')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: windows-packages
          path: release-assets
      - name: Generate checksums
        shell: bash
        run: |
          cd release-assets
          sha256sum *.zip > SHA256SUMS.txt
          test "$(find . -maxdepth 1 -type f -name '*.zip' | wc -l)" -eq 2
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: v0.5.2
          name: Controller Bridge v0.5.2
          target_commitish: main
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          overwrite_files: true
          files: release-assets/*
          body: |
            ## English
            Windows 0.5.2 keeps the host running while USB waits for an authorized Android phone and prepares ADB reverse automatically when the phone becomes available. Windows packages are available in PT-BR and English. Android packages are unchanged; see v0.5.1 for the APKs. SHA256SUMS.txt contains checksums for both Windows packages.

            ## Português
            O Windows 0.5.2 mantém o host aberto enquanto o USB aguarda um celular Android autorizado e prepara o ADB reverse automaticamente quando o celular fica disponível. Os pacotes Windows estão em PT-BR e inglês. Os APKs Android não mudaram; consulte a v0.5.1. SHA256SUMS.txt contém os hashes dos dois pacotes Windows.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
