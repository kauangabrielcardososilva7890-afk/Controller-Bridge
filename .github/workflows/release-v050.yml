name: Build and publish Controller Bridge release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release-v050.yml"
      - "product/windows-host/**"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - name: Build both Windows packages
        shell: pwsh
        run: .\product\windows-host\Package-Release.ps1 -OutputPath artifacts\windows
      - uses: actions/upload-artifact@v7
        with:
          name: windows-packages
          path: |
            artifacts/windows/ControllerBridge-Windows-PT-BR-v0.6.2.zip
            artifacts/windows/ControllerBridge-Windows-EN-v0.6.2.zip
          if-no-files-found: error
          retention-days: 2

  release:
    needs: [windows]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
      github.event.head_commit.message == 'Release Controller Bridge v0.6.2')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: windows-packages
          path: release-assets
      - name: Generate checksums
        shell: bash
        run: |
          cd release-assets
          sha256sum *.zip > SHA256SUMS.txt
          test "$(find . -maxdepth 1 -type f -name '*.zip' | wc -l)" -eq 2
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: v0.6.2
          name: Controller Bridge v0.6.2
          target_commitish: main
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          overwrite_files: true
          files: release-assets/*
          body: |
            ## English
            Fixes the Windows Xbox 360 / DualShock 4 selector. Live input refreshes no longer overwrite a pending dropdown choice, and output changes are applied only after the user commits the selection. The Android APK is unchanged; use v0.6.1.

            ## Português
            Corrige o seletor Xbox 360 / DualShock 4 no Windows. A atualização dos comandos ao vivo não sobrescreve a escolha enquanto a lista está aberta, e a troca é aplicada quando a seleção é confirmada. O APK Android não mudou; use a v0.6.1.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
